# SFT Training Configuration
learning_rate: 2.0e-4
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
warmup_ratio: 0.05
lr_scheduler_type: "cosine"
weight_decay: 0.01
logging_steps: 10
save_strategy: "epoch"
bf16: true
max_seq_length: 1024
dataset_text_field: "text"
seed: 42
