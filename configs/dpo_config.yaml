# DPO Training Configuration
beta: 0.1
learning_rate: 5.0e-5
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
warmup_ratio: 0.05
lr_scheduler_type: "cosine"
weight_decay: 0.01
logging_steps: 10
save_strategy: "epoch"
bf16: true
max_length: 1024
gradient_checkpointing: true
seed: 42
